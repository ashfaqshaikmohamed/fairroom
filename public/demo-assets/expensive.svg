<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-exp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4F4"/>
      <stop offset="100%" stop-color="#EFE6E6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-exp)"/>
  <rect x="40" y="40" width="720" height="420" fill="none" stroke="#EAC4C1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- High-Rise Elevator Building Elevation -->
  <line x1="80" y1="420" x2="720" y2="420" stroke="#9E372B" stroke-width="3"/>
  <rect x="220" y="110" width="360" height="310" fill="#FFFFFF" stroke="#3A4036" stroke-width="2"/>

  <!-- High-rise glass balconies -->
  <line x1="220" y1="180" x2="580" y2="180" stroke="#DEE2D8" stroke-width="1.5"/>
  <line x1="220" y1="250" x2="580" y2="250" stroke="#DEE2D8" stroke-width="1.5"/>
  <line x1="220" y1="320" x2="580" y2="320" stroke="#DEE2D8" stroke-width="1.5"/>

  <!-- Budget Cap Exceeded Badge -->
  <rect x="180" y="55" width="440" height="45" rx="6" fill="#FBEFEF" stroke="#9E372B" stroke-width="1.5"/>
  <circle cx="210" cy="77" r="14" fill="#9E372B"/>
  <text x="210" y="82" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF">$</text>
  <text x="235" y="82" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#9E372B">BUDGET EXCEEDED: $5,200 &gt; $5,100 COMBINED CAP</text>

  <!-- Typographic Label -->
  <rect x="60" y="445" width="680" height="35" rx="4" fill="#FFFFFF" stroke="#DEE2D8"/>
  <text x="75" y="468" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#242823">190 THIRD ST · KENDALL SQ, CAMBRIDGE</text>
  <text x="705" y="468" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9E372B">DOES NOT FIT COMBINED HOUSEHOLD BUDGET · SAMPLE HOME</text>
</svg>

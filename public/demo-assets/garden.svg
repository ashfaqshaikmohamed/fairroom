<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-garden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F5F0"/>
      <stop offset="100%" stop-color="#E2EADF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-garden)"/>
  <rect x="40" y="40" width="720" height="420" fill="none" stroke="#DEE2D8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Ground & Garden Patio -->
  <rect x="80" y="320" width="640" height="100" fill="#E8ECE4" stroke="#52634D" stroke-width="2"/>
  <line x1="80" y1="420" x2="720" y2="420" stroke="#3A4036" stroke-width="3"/>

  <!-- Building Upper Levels (Clapboard) -->
  <rect x="140" y="100" width="520" height="220" fill="#FAFBF9" stroke="#3A4036" stroke-width="2"/>
  <line x1="140" y1="140" x2="660" y2="140" stroke="#DEE2D8" stroke-width="1"/>
  <line x1="140" y1="180" x2="660" y2="180" stroke="#DEE2D8" stroke-width="1"/>
  <line x1="140" y1="220" x2="660" y2="220" stroke="#DEE2D8" stroke-width="1"/>
  <line x1="140" y1="260" x2="660" y2="260" stroke="#DEE2D8" stroke-width="1"/>

  <!-- Garden Level Flat Entrance & Windows -->
  <rect x="180" y="330" width="100" height="80" fill="#FFFFFF" stroke="#3A4036" stroke-width="1.5"/>
  <line x1="230" y1="330" x2="230" y2="410" stroke="#52634D" stroke-width="1.5"/>
  <line x1="180" y1="370" x2="280" y2="370" stroke="#52634D" stroke-width="1.5"/>

  <!-- Garden Doorway -->
  <rect x="350" y="320" width="100" height="100" fill="#EAF2EB" stroke="#3A4036" stroke-width="2"/>
  <circle cx="430" cy="370" r="4" fill="#3A4036"/>

  <!-- Second Garden Window -->
  <rect x="520" y="330" width="100" height="80" fill="#FFFFFF" stroke="#3A4036" stroke-width="1.5"/>
  <line x1="570" y1="330" x2="570" y2="410" stroke="#52634D" stroke-width="1.5"/>
  <line x1="520" y1="370" x2="620" y2="370" stroke="#52634D" stroke-width="1.5"/>

  <!-- Driveway Parking Spot (Orchard St feature) -->
  <rect x="630" y="360" width="70" height="55" fill="#E4EAE1" stroke="#52634D" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="665" y="392" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#52634D">PARKING</text>

  <!-- Garden planters -->
  <rect x="110" y="380" width="50" height="35" fill="#C4CABE" stroke="#3A4036" stroke-width="1"/>
  <circle cx="135" cy="375" r="16" fill="#52634D"/>
  <rect x="470" y="380" width="40" height="35" fill="#C4CABE" stroke="#3A4036" stroke-width="1"/>
  <circle cx="490" cy="375" r="14" fill="#445340"/>

  <!-- Typographic Label -->
  <rect x="60" y="445" width="680" height="35" rx="4" fill="#FFFFFF" stroke="#DEE2D8"/>
  <text x="75" y="468" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#242823">28 ORCHARD ST · PORTER SQ, CAMBRIDGE</text>
  <text x="705" y="468" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#52634D">GARDEN LEVEL ARCHITECTURAL ELEVATION · SAMPLE HOME</text>
</svg>

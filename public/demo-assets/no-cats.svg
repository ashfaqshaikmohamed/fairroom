  <rect x="520" y="160" width="100" height="90" fill="#FAFBF9" stroke="#3A4036" stroke-width="1.5"/>
  <line x1="570" y1="160" x2="570" y2="250" stroke="#9E372B" stroke-width="1.5"/>

  <rect x="350" y="300" width="100" height="120" fill="#FBEFEF" stroke="#3A4036" stroke-width="2"/>
  <circle cx="430" cy="360" r="4" fill="#3A4036"/>


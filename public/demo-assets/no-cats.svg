  </defs>

  <rect width="800" height="500" fill="url(#bg-nocats)"/>
  <rect x="40" y="40" width="720" height="420" fill="none" stroke="#EAC4C1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Building -->
  <line x1="80" y1="420" x2="720" y2="420" stroke="#9E372B" stroke-width="3"/>
  <rect x="140" y="120" width="520" height="300" fill="#FFFFFF" stroke="#3A4036" stroke-width="2"/>

  <!-- Windows & Door -->
  <rect x="180" y="160" width="100" height="90" fill="#FAFBF9" stroke="#3A4036" stroke-width="1.5"/>
  <line x1="230" y1="160" x2="230" y2="250" stroke="#9E372B" stroke-width="1.5"/>
  <rect x="350" y="160" width="100" height="90" fill="#FAFBF9" stroke="#3A4036" stroke-width="1.5"/>

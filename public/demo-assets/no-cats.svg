  <rect x="60" y="445" width="680" height="35" rx="4" fill="#FFFFFF" stroke="#DEE2D8"/>
  <text x="75" y="468" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#242823">91 ELM ST · INMAN SQ, CAMBRIDGE</text>
